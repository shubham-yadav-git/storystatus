name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Display Deployment Info
        run: |
          echo "🚀 Deployment Information"
          echo "========================="
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Target Track: ${{ inputs.track || 'internal' }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ Error: KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/keystore-original
          
          if [ ! -s $GITHUB_WORKSPACE/keystore-original ]; then
            echo "❌ Error: Keystore decode failed - file is empty"
            exit 1
          fi
          
          if file $GITHUB_WORKSPACE/keystore-original | grep -q "Java KeyStore"; then
            echo "Keystore is already in JKS format"
            mv $GITHUB_WORKSPACE/keystore-original $GITHUB_WORKSPACE/keystore.jks
            echo "KEYSTORE_TYPE=JKS" >> $GITHUB_ENV
          else
            echo "Converting PKCS12 keystore to JKS format"
            keytool -importkeystore \
              -srckeystore $GITHUB_WORKSPACE/keystore-original \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -destkeystore $GITHUB_WORKSPACE/keystore.jks \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -noprompt
            echo "KEYSTORE_TYPE=JKS" >> $GITHUB_ENV
            rm $GITHUB_WORKSPACE/keystore-original
          fi
      
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace
        env:
          CI: true
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
      
      - name: Prepare Service Account JSON
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ Error: PLAY_STORE_SERVICE_ACCOUNT_JSON secret is empty or not configured!"
            exit 1
          fi
          
          if [[ "$SERVICE_ACCOUNT_JSON" =~ ^[[:space:]]*\{ ]]; then
            echo "$SERVICE_ACCOUNT_JSON" > $GITHUB_WORKSPACE/service-account.json
            echo "Service account JSON provided as raw text."
          else
            echo "$SERVICE_ACCOUNT_JSON" | base64 --decode > $GITHUB_WORKSPACE/service-account.json
            echo "Service account JSON decoded from base64."
          fi
          
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/service-account.json'))" 2>/dev/null; then
            echo "❌ Error: service-account.json is not valid JSON! Please check your PLAY_STORE_SERVICE_ACCOUNT_JSON secret."
            exit 1
          fi
      
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: ${{ github.workspace }}/service-account.json
          packageName: com.sky.storystatus
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
          changesNotSentForReview: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
      
      - name: Cleanup
        if: always()
        run: |
          rm -f $GITHUB_WORKSPACE/keystore.jks
          rm -f $GITHUB_WORKSPACE/service-account.json
